services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: epv
      POSTGRES_USER: epv
      POSTGRES_PASSWORD: epv
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epv -d epv"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://epv:epv@db:5432/epv
      JWT_SECRET: epv-compose-secret
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
